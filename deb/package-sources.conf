# Debian-family packages that do NOT come from the default (main) Debian archive.
# One package per line:  <package>  <origin>  [free-form note]
#
# This is the single source of truth for the Debian tooling:
#   scripts/gen.py            writes it into the metapackage descriptions
#   scripts/build-deb.sh      refuses to build a metapackage whose repo-provided dependency is missing
#   scripts/check-deps.sh     classifies every dependency and explains how to satisfy it
#
# Origins:
#   built              built from source by scripts/build-deb.sh, always required by a metapackage
#   upstream           upstream binary .deb mirrored after a SHA-256 check, required by a metapackage
#   built-optional     built only on request (BUILD_x=1); no metapackage depends on it unconditionally
#   upstream-optional  mirrored only on request (BUILD_x=1); no metapackage depends on it
#   contrib            lives in Debian's "contrib" component (enable with scripts/enable-steam-prereqs.sh)
#   contrib+i386       like contrib, and also needs the i386 architecture enabled in dpkg
#
# Packages not listed here are expected in Debian's main component.

wm-desktop           built              deb/hosted/wm-desktop (github.com/Reedman27/wm-desktop)
wmvol                built              deb/hosted/wmvol (github.com/Reedman27/dockapps-collection)
wmmedia              built              deb/hosted/wmmedia (github.com/Reedman27/dockapps-collection)
equibop              upstream           Equicord/Equibop amd64 .deb, verified against EQUIBOP_SHA256

reedmuhn-cider-repo  built-optional     BUILD_CIDER_REPO=1
minecraft-launcher   upstream-optional  BUILD_MINECRAFT=1

winetricks           contrib            Debian contrib
steam-installer      contrib+i386       Debian contrib; its steam-libs-i386 dependency needs dpkg --add-architecture i386
