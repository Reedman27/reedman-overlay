name: Validate metadata (all distributions)

# Cheap checks that apply to every distribution: meta.json is valid, every build script parses, and the files
# generated from meta.json are up to date. Skipped for documentation-only changes. The heavy Debian/Devuan
# checks live in validate-deb.yml and only run when Debian files change.
on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

jobs:
  metadata:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install tools (checkout needs git and node)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates nodejs python3
      - uses: actions/checkout@v4
      - name: Validate metadata and shell syntax
        run: |
          python3 -m json.tool meta.json >/dev/null
          bash -n bootstrap.sh scripts/*.sh rpm/*.sh arch/*.sh opensuse/*.sh void/*.sh
          for f in arch/*/PKGBUILD; do bash -n "$f"; done
      - name: Verify generated files are current
        run: |
          git config --global --add safe.directory "$PWD"
          python3 scripts/gen.py
          git diff --exit-code
