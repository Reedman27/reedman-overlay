name: Debian and Devuan package validation

on:
  push:
  pull_request:

# Forgejo Actions. Adjust `runs-on` to a label your runner provides (the default is `docker`).
jobs:
  static:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install tools (checkout needs git and node)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates nodejs python3 dpkg-dev
      - uses: actions/checkout@v4
      - name: Validate metadata and shell syntax
        run: |
          python3 -m json.tool meta.json >/dev/null
          bash -n bootstrap.sh scripts/*.sh rpm/*.sh arch/*.sh opensuse/*.sh void/*.sh
          for f in arch/*/PKGBUILD; do bash -n "$f"; done
      - name: Verify generated files are current
        run: |
          git config --global --add safe.directory "$PWD"
          python3 scripts/gen.py
          git diff --exit-code
      - name: Build and inspect DEB metapackages
        run: scripts/test-deb.sh

  apt-resolution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "devuan/devuan:excalibur"]
    container:
      image: ${{ matrix.image }}
    name: APT dependency resolution (${{ matrix.image }})
    steps:
      - name: Prepare apt (enable contrib for winetricks) and install tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sed -i -E "/^Components:/ { /(^|[[:space:]])contrib([[:space:]]|$)/! s/$/ contrib/; }" "$f"
          done
          if [ -f /etc/apt/sources.list ]; then
            sed -i -E "/^[[:space:]]*deb(-src)?[[:space:]]/ { /[[:space:]]contrib([[:space:]]|$)/! s/[[:space:]]main([[:space:]]|$)/ main contrib/; }" /etc/apt/sources.list
          fi
          # steam-installer (reedmuhn-gaming) needs contrib/non-free and i386
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sed -i -E "/^Components:/ { /(^|[[:space:]])non-free([[:space:]]|$)/! s/$/ non-free/; }" "$f"
          done
          if [ -f /etc/apt/sources.list ]; then
            sed -i -E "/^[[:space:]]*deb(-src)?[[:space:]]/ { /[[:space:]]non-free([[:space:]]|$)/! s/[[:space:]]main([[:space:]]|$)/ main non-free\1/; }" /etc/apt/sources.list
          fi
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates nodejs python3 curl build-essential dpkg-dev debhelper pkgconf \
            libx11-dev libxext-dev libxft-dev libfontconfig-dev libdbus-1-dev libwraster-dev
      - uses: actions/checkout@v4
      - name: Build packages and resolve dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          BUILD_EQUIBOP=1 scripts/build-deb.sh
          scripts/check-deps.sh
          apt-get install -s --no-install-recommends ./out/*.deb
